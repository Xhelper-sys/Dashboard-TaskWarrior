<!DOCTYPE html>
<html>
  <head>
    <title>
      Dasboard
    </title>
    <link rel="stylesheet" href="./styles/index.css">
  </head>
  <body>

    <!-- NAV BAR SECTION -->

    <div class="nav-bar">

      <!-- TITLE NAV BAR SECTION -->

      <div class="title-nav-bar-section">
        <div class="left-title-nav-section">
          <img class="img-coreTech" src="./images/orca-svgrepo-com.svg">
          <p class="name-company">
            CoreTech 
          </p>
        </div>
        <div class="right-title-nav-section">
          <a href="" target="_blank">
            <img class="logo-internet" src="./images/internet-internet-of-things-iot-svgrepo-com.svg">
          </a>
        </div>
      </div>

      <!-- DASHBOARD SECTION -->

      <div class="dashboard-title-box">
        <img class="dashboard-img" src="./images/dashboard-svgrepo-com.svg">
        <p class="dashboard-title">
          DASHBOARD
        </p>
      </div>

      <div class="line">
      </div>

      <div class="dashboard-list-container">
        <div class="cyan-section">
          <p class="dash-section-text">
            Daily
          </p>
        </div>
        <div class="blue-section">
          <p class="dash-section-text">
            Project
          </p>
        </div>
        <div class="cyan-section">
          <p class="dash-section-text">
            Trophy
          </p>
        </div>
      </div>

    </div>
    <div class="dashboard-information">
      <div class="header">
        <div class="section-left-header">
          <img class="message-icons" src="./images/message-square-dots-svgrepo-com.svg">
          <img src="./images/mail-svgrepo-com.svg" class="mail-icons">
          <img src="./images/calendar-lines-svgrepo-com.svg" class="calendar-icons">
        </div>
        <div class="section-right-header">
          <div class="header-section-sub-left">
            <img class="flag-french-svg" src="./images/flag-for-flag-france-svgrepo-com.svg">
            <p class="french-text">
              France
            </p>
          </div>
          <div class="header-section-sub-right">
            <div class="notification-container">
             <img src="./images/notification-12-svgrepo-com.svg" class="notification-icon">

             <div class="red-box">
              <p>
                0
              </p>
             </div>
            </div>

            <div class="name-profile-container">
              <div class="name-section">
                <p class="main-name-text">
                  Mustafa Kaya
                </p>
                <p class="second-text">
                  Businessman
                </p>
              </div>
              <div>
                <img src="./images/myProfile.png" class="profile-img">
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="panel-control">
        <div class="first-section">
          <div class="winstreak-container">
            <div class="win-strek-header">
              <div class="title-win-strek-container">
                <p class="title-text-win-streak">
                  Win Streak
                </p>
                <p class="subtitle-text-win-streak">
                  Task Warrior
                </p>
              </div>
              <div>
                <img src="./images/menu-svgrepo-com.svg" class="menu-winstrek-img">
              </div>
            </div>
            <div class="win-strek-container-middle">
              <div class="description-container-win-streak"></div>
              <div class="image-container-win-streak">
                <img class="trophy-img" src="./images/trophy-cup-svgrepo-com.svg">
              </div>
            </div>
          </div>


          <div style="background-color: blue;">q</div>
          <div style="background-color: blue;">q</div>
        </div>

        <div>2</div>
        <div>3</div>
      </div>
      <div></div>
    </div>
    <script></script>
